name: Build

on:
    push:
        paths: &build_paths
            - ".github/workflows/build.yml"
            - "src/**"
            - "test.js"
            - "package.json"
            - "package-lock.json"
            - "cordis.patch.yml"
    pull_request:
        paths: *build_paths

concurrency:
    group: build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7

            - name: Install dependencies
              run: npm ci

            - name: Check source
              run: npm run check

            - name: Run tests
              run: npm test

            - name: Verify committed build artifacts are up to date
              run: |
                  if [ -n "$(git status --porcelain src/)" ]; then
                      echo "Error: Committed build artifacts in src/ are out of sync with TypeScript sources."
                      echo "Please run 'npm run build' and commit all generated files."
                      git status --porcelain src/
                      git diff src/
                      exit 1
                  fi

            - name: Verify npm package
              run: npm pack --dry-run
