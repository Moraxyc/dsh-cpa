name: Build

on:
    push:
        paths: &build_paths
            - ".github/workflows/build.yml"
            - "src/**"
            - "tests/**"
            - "scripts/**"
            - "tsconfig.json"
            - "tsconfig.build.json"
            - "tsconfig.client.json"
            - "tsconfig.test.json"
            - "oxlint.config.ts"
            - "tools/oxlint/**"
            - "package.json"
            - "package-lock.json"
            - "cordis.patch.yml"
    pull_request:
        paths: *build_paths

concurrency:
    group: build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            matrix:
                node-version: [24.22.2, 26.12.1]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Check source
              run: npm run check

            - name: Run tests
              run: npm test

            - name: Verify build output
              run: |
                  test -f lib/index.js
                  test -f lib/client.js
                  test -f lib/index.d.ts

            - name: Verify npm package
              run: npm pack --dry-run
